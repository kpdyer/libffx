[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "libffx"
version = "2.0.1"
description = "FF1 format-preserving encryption (NIST SP 800-38G)"
readme = "README_PYPI.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Kevin P. Dyer", email = "kpdyer@gmail.com"}
]
maintainers = [
    {name = "Kevin P. Dyer", email = "kpdyer@gmail.com"}
]
keywords = ["cryptography", "encryption", "format-preserving", "ff1", "ffx", "fpe", "aes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "mypy>=2.3.1",
]

[project.urls]
Homepage = "https://github.com/kpdyer/libffx"
Repository = "https://github.com/kpdyer/libffx"
Issues = "https://github.com/kpdyer/libffx/issues"

[tool.setuptools.packages.find]
include = ["ffx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["ffx"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
