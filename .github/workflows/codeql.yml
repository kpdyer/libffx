name: CodeQL

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "27 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: python
          queries: security-extended
          # Marks a result as suppressed when the line directly above it has a
          # `# codeql[<rule-id>] <justification>` comment.
          packs: codeql/python-queries:AlertSuppression.ql

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: "/language:python"
          output: sarif-results
          # Uploaded below, once suppressed results are removed.
          upload: failure-only

      # Code scanning ignores SARIF suppressions, so suppressed results are
      # dropped before upload. That keeps them out of PR checks as well as the
      # default branch, and the justification stays next to the code. Only the
      # rules named here can be suppressed: CodeQL also treats a bare `# noqa`
      # or `# lgtm` comment as suppressing every alert on its line.
      - name: Drop suppressed results
        run: >-
          jq '.runs[].results |= map(select((.suppressions // []) == []
          or (.ruleId | IN("py/weak-cryptographic-algorithm") | not)))'
          sarif-results/python.sarif > python.sarif

      - name: Upload CodeQL results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: python.sarif

  analyze-actions:
    name: Analyze (Actions)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: actions
          queries: security-extended

      - name: Analyze workflow security
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:actions
